name: Build AI Trading Engine APK

on:
  workflow_dispatch:
  push:
    branches:
      - principal
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android
        uses: android-actions/setup-android@v3

      - name: Instalar SDK Android
        shell: bash
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Extraer proyecto
        shell: bash
        run: |
          ZIP=$(find . -maxdepth 1 -type f -name "*.zip" | head -1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: No se encontró el archivo ZIP."
            exit 1
          fi

          rm -rf proyecto
          mkdir -p proyecto
          unzip -q "$ZIP" -d proyecto

      - name: Localizar proyecto Android
        shell: bash
        run: |
          ROOT=$(find proyecto -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print -quit)

          if [ -z "$ROOT" ]; then
            echo "ERROR: No se encontró settings.gradle."
            exit 1
          fi

          ROOT=$(dirname "$ROOT")

          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "Proyecto encontrado en: $ROOT"

      - name: Configurar AndroidX
        shell: bash
        run: |
          touch "$PROJECT_ROOT/gradle.properties"

          grep -q '^android.useAndroidX=' "$PROJECT_ROOT/gradle.properties" \
            || echo 'android.useAndroidX=true' >> "$PROJECT_ROOT/gradle.properties"

          grep -q '^android.enableJetifier=' "$PROJECT_ROOT/gradle.properties" \
            || echo 'android.enableJetifier=true' >> "$PROJECT_ROOT/gradle.properties"

          grep -q '^org.gradle.jvmargs=' "$PROJECT_ROOT/gradle.properties" \
            || echo 'org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8' >> "$PROJECT_ROOT/gradle.properties"

      - name: Verificar Java
        shell: bash
        run: |
          java -version
          javac -version

      - name: Configurar JVM 17
        shell: bash
        run: |
          cat > "$GITHUB_WORKSPACE/force-java17.gradle" <<'EOF'
          allprojects {
              tasks.withType(JavaCompile).configureEach {
                  sourceCompatibility = "17"
                  targetCompatibility = "17"
              }
          }
          EOF

      - name: Compilar APK
        shell: bash
        run: |
          cd "$PROJECT_ROOT"

          gradle \
            --no-daemon \
            -I "$GITHUB_WORKSPACE/force-java17.gradle" \
            :app:assembleDebug

      - name: Buscar APK
        shell: bash
        run: |
          find "$PROJECT_ROOT" -type f -name "*.apk" -print

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Trading-Engine-APK
          path: ${{ env.PROJECT_ROOT }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
