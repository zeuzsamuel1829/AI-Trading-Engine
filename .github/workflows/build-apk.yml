name: Build AI Trading Engine APK

on:
  workflow_dispatch:
  push:
    branches:
      - principal
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android
        uses: android-actions/setup-android@v3

      - name: Instalar SDK Android
        shell: bash
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Extraer proyecto
        shell: bash
        run: |
          ZIP=$(find . -maxdepth 1 -type f -name "*.zip" | head -1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: No se encontró el archivo ZIP."
            exit 1
          fi

          rm -rf proyecto
          mkdir -p proyecto
          unzip -q "$ZIP" -d proyecto

      - name: Localizar proyecto Android
        shell: bash
        run: |
          ROOT=$(find proyecto -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print -quit | xargs -r dirname)

          if [ -z "$ROOT" ]; then
            echo "ERROR: No se encontró settings.gradle."
            exit 1
          fi

          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "Proyecto encontrado en: $ROOT"

      - name: Verificar Java
        run: |
          java -version
          javac -version

      - name: Forzar Java y Kotlin a JVM 17
        shell: bash
        run: |
          cat > "$GITHUB_WORKSPACE/force-java17.gradle" <<'EOF'
          allprojects {
              afterEvaluate {
                  tasks.withType(JavaCompile).configureEach {
                      sourceCompatibility = "17"
                      targetCompatibility = "17"
                  }

                  tasks.matching {
                      it.name.toLowerCase().contains("kotlin")
                  }.configureEach {
                      try {
                          kotlinOptions.jvmTarget = "17"
                      } catch (Exception ignored) {
                      }
                  }

                  if (project.hasProperty("android")) {
                      android {
                          compileOptions {
                              sourceCompatibility JavaVersion.VERSION_17
                              targetCompatibility JavaVersion.VERSION_17
                          }
                      }
                  }
              }
          }
          EOF

      - name: Forzar propiedad JVM
        shell: bash
        run: |
          cat > "$PROJECT_ROOT/gradle.properties" <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          kotlin.jvm.target.validation.mode=error
          EOF

      - name: Compilar APK
        shell: bash
        run: |
          cd "$PROJECT_ROOT"

          gradle \
            --no-daemon \
            -I "$GITHUB_WORKSPACE/force-java17.gradle" \
            :app:assembleDebug

      - name: Buscar APK
        shell: bash
        run: |
          echo "Buscando APK..."
          find "$PROJECT_ROOT" -type f -name "*.apk" -print

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Trading-Engine-APK
          path: ${{ env.PROJECT_ROOT }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
